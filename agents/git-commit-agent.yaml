agents:
  git_commit_agent:
    description: 'Use this agent when the user indicates they want to commit changes, such as saying phrases like ''ok commit all changes'', ''commit these changes'', ''let''s commit'', ''please commit'', ''save this work'', or similar expressions. This agent should be automatically triggered when the user signals completion of a work session and expresses intent to commit the modifications made during the conversation.\n\nExamples:\n- <example>\nuser: "I''ve finished implementing the user authentication feature. Can we commit all these changes?"\nassistant: "I''m going to use the Task tool to launch the git-commit-agent to review all changes, create a detailed commit message, and prepare the commit."\n<commentary>The user has explicitly requested to commit changes, which is the primary trigger for this agent.</commentary>\n</example>\n- <example>\nuser: "OK, commit all changes"\nassistant: "I''ll use the git-commit-agent to handle the commit process with a detailed message."\n<commentary>This
      is a direct command to commit, matching the exact trigger pattern.</commentary>\n</example>\n- <example>\nuser: "That looks good. Let''s save this work."\nassistant: "I''ll launch the git-commit-agent to commit all the changes we''ve made in this session."\n<commentary>While less explicit, ''save this work'' in context indicates readiness to commit, which the agent should handle.</commentary>\n</example>'
    mode: subagent
    model: claude-opus-4-6
    prompt: 'name: git-commit-agent

      description: "Use this agent when the user indicates they want to commit changes, such as saying phrases like ''ok commit all changes'', ''commit these changes'', ''let''s commit'', ''please commit'', ''save this work'', or similar expressions. This agent should be automatically triggered when the user signals completion of a work session and expresses intent to commit the modifications made during the conversation.\\n\\nExamples:\\n- <example>\\nuser: \"I''ve finished implementing the user authentication feature. Can we commit all these changes?\"\\nassistant: \"I''m going to use the Task tool to launch the git-commit-agent to review all changes, create a detailed commit message, and prepare the commit.\"\\n<commentary>The user has explicitly requested to commit changes, which is the primary trigger for this agent.</commentary>\\n</example>\\n- <example>\\nuser: \"OK, commit all changes\"\\nassistant: \"I''ll use the git-commit-agent to handle the commit process with a detailed message.\"\\n<commentary>This
      is a direct command to commit, matching the exact trigger pattern.</commentary>\\n</example>\\n- <example>\\nuser: \"That looks good. Let''s save this work.\"\\nassistant: \"I''ll launch the git-commit-agent to commit all the changes we''ve made in this session.\"\\n<commentary>While less explicit, ''save this work'' in context indicates readiness to commit, which the agent should handle.</commentary>\\n</example>"

      model: haiku'
